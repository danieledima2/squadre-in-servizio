<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squadre in Servizio</title>
<meta name="theme-color" content="#b5121b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squadre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --red:#b5121b; --red-d:#8e0e15; --bg:#f3f4f6; --card:#fff; --ink:#1f2328; --mut:#6b7280;
  --line:#e5e7eb; --ok:#15803d; --warn:#b45309; --rad:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--red);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:15px}
.offline-badge{font-size:12px;background:#fff;color:var(--red);border-radius:20px;padding:2px 8px;font-weight:600;display:none}
body.is-offline .offline-badge{display:inline-block}
main{padding:14px;padding-bottom:calc(84px + var(--safe-b));max-width:1000px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:1000;padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;font-size:12px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--red);font-weight:600}
.card{background:var(--card);border-radius:var(--rad);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:14px 0 8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--red);color:#fff;cursor:pointer;font-weight:600;font-size:15px}
.btn:active{background:var(--red-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--red);padding:8px 10px}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.full{width:100%}
.ib{border:0;background:#f3f4f6;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
.ib:active{background:#e5e7eb}
.list-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.title{font-weight:600}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:2px 8px;background:#f3f4f6;color:var(--mut);margin-right:4px}
.tag.warn{background:#fef3c7;color:var(--warn)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.empty{text-align:center;color:var(--mut);padding:24px 10px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
label.f{display:block;margin-bottom:10px;font-size:14px;color:var(--mut)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--ink)}
label.f textarea{min-height:60px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.seg label{flex:1;text-align:center;padding:10px 6px;cursor:pointer;color:var(--ink);font-size:15px}
.seg input{display:none}
.seg label:has(input:checked){background:var(--red);color:#fff}
/* dialog */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + var(--safe-b))}
@media(min-width:700px){.ovl{align-items:center}.dlg{border-radius:16px}}
.dlg h2{margin-top:0}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:4000;font-size:14px;max-width:90vw;text-align:center}
/* servizio */
body.in-svc main{max-width:none;padding:0;padding-bottom:0}
body.in-svc nav.tabs{display:none}
.svc{display:flex;flex-direction:column;height:calc(100vh - 52px - var(--safe-t));height:calc(100dvh - 52px - var(--safe-t))}
.mapwrap{position:relative;flex:none;height:50%;min-height:260px;background:#dfe3e8}
#map{position:absolute;inset:0}
.panel{flex:1;overflow:auto;background:var(--bg);padding:0 0 calc(16px + var(--safe-b))}
.ptabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.ptabs button{flex:1;border:0;background:none;padding:12px 4px;cursor:pointer;font-size:15px;color:var(--mut);border-bottom:3px solid transparent}
.ptabs button.on{color:var(--red);border-color:var(--red);font-weight:600}
.pbody{padding:12px}
@media(min-width:900px){
  .svc{flex-direction:row-reverse}
  .mapwrap{height:auto;flex:1}
  .panel{flex:none;width:400px;border-right:1px solid var(--line)}
}
.placing-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:900;background:#111;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;max-width:94%}
.placing-bar button{background:#fff;color:#111;border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
.map-tools{position:absolute;right:10px;bottom:24px;z-index:800;display:flex;flex-direction:column;gap:6px}
.map-tools button{background:#fff;border:0;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:8px 10px;cursor:pointer;font-size:14px}
@media(max-width:600px){.map-tools button span{display:none}.map-tools button{width:42px;height:42px;font-size:18px;padding:0}}
.map-search{position:absolute;left:54px;right:10px;top:10px;z-index:800;display:flex;gap:6px;max-width:420px}
.map-search input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:16px}
.map-search button{border:0;border-radius:10px;background:var(--red);color:#fff;padding:0 12px;cursor:pointer}
.nomap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
.legend span{display:flex;align-items:center;gap:5px;font-size:13px}
/* marker */
.pin{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.pin-lbl{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.25);color:#111;line-height:1.35;text-align:center}
.pin-lbl i{font-style:normal;font-weight:400;color:#555;display:block;font-size:10px}
body.hide-labels .pin-lbl{display:none}
.leaflet-div-icon.vpin{background:none;border:0}
.ppt{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#111;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.pgrp{position:absolute;left:0;bottom:10px;transform:translateX(-50%);background:#fff;border:2px solid #111;border-radius:10px;padding:3px 7px 4px;text-align:center;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);color:#111;cursor:pointer}
.pgrp:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#111;border-bottom:0}
.pgrp-n{font-weight:700;font-size:12px}
.pgrp-v{display:flex;gap:3px;justify-content:center;margin-top:3px;flex-wrap:wrap;max-width:190px}
.pgrp-l{font-size:10.5px;line-height:1.3;margin-top:3px;color:#333}
.pgrp-e{font-size:10px;color:#888}
body.hide-labels .pgrp-l{display:none}
.mini{width:22px;height:22px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pop b{font-size:15px}
.pop div{margin:2px 0}
.squad-h{display:flex;align-items:center;gap:8px;font-weight:600;margin:14px 0 4px;font-size:14px}
.squad-h:first-child{margin-top:0}
/* print */
#printHead,#printTable{display:none}
body.printing .svc{height:auto;display:block}
body.printing .mapwrap{height:15cm;width:100%;max-width:19cm}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header,nav.tabs,.panel,.map-tools,.map-search,.placing-bar,.leaflet-control-zoom,.leaflet-control-layers{display:none!important}
  main{padding:0!important}
  #printHead,#printTable{display:block!important}
  .svc{height:auto!important;display:block!important}
  .mapwrap{height:15cm!important;width:19cm!important;border:1px solid #999;break-inside:avoid}
  .pin,.ppt{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  th,td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
  th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ptsq td{background:#f6f6f6;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printHead h1{font-size:18px;margin:0 0 2px}
#printHead p{margin:0 0 8px;font-size:12px}
/* ===== v2 ===== */
.ptabs{overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;padding:12px 13px;white-space:nowrap}
.ptabs .bdg{display:inline-block;background:var(--warn);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700}
.pin{position:relative}
.pin.st-pausa,.mini.st-pausa{box-shadow:0 0 0 3px #facc15,0 1px 4px rgba(0,0,0,.4)}
.pin.st-interv,.mini.st-interv{box-shadow:0 0 0 3px #ef4444,0 1px 4px rgba(0,0,0,.4);animation:pul 1.2s infinite}
.pin.st-rientrato,.mini.st-rientrato{opacity:.35;filter:grayscale(1)}
@keyframes pul{50%{box-shadow:0 0 0 7px rgba(239,68,68,.25),0 1px 4px rgba(0,0,0,.4)}}
.pin[data-b]:after{content:attr(data-b);position:absolute;top:-9px;right:-11px;font-size:14px}
.pgrp.mz{border-color:#1d4ed8}
.pgrp.mz:after{border-top-color:#1d4ed8}
.pt{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #111;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.iv{width:28px;height:28px;transform:rotate(45deg);background:#f97316;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;margin:3px}
.iv span{transform:rotate(-45deg);color:#fff;font-weight:800;font-size:13px}
.iv.chiuso{background:#9ca3af}
.chip{border:0;border-radius:20px;padding:4px 9px;font-size:13px;cursor:pointer;background:#f3f4f6;flex:none}
.chip.st-post{background:#dcfce7}.chip.st-pausa{background:#fef9c3}.chip.st-interv{background:#fee2e2}.chip.st-rientrato{background:#e5e7eb}
.sheet a,.sheet button.it{display:flex;align-items:center;gap:10px;width:100%;padding:13px 12px;border:0;background:#f3f4f6;border-radius:10px;margin-bottom:8px;font-size:16px;cursor:pointer;text-decoration:none;color:var(--ink);text-align:left}
.sheet .sts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sheet .sts button{border:2px solid transparent;border-radius:10px;padding:10px 6px;cursor:pointer;font-size:14px}
.sheet .sts button.on{border-color:#111;font-weight:700}
.warnl{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.warnl:last-child{border-bottom:0}
.cnt{display:flex;flex-wrap:wrap;gap:6px}
.cnt span{background:#f3f4f6;border-radius:8px;padding:4px 8px;font-size:13px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:20px;height:20px}
.diar{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.diar b{flex:none;width:44px;color:var(--mut);font-weight:600}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addgrid button{border:0;background:#f3f4f6;border-radius:12px;padding:14px 8px;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.addgrid button span{font-size:26px}
.map-tools button.on{background:#1d4ed8;color:#fff}
@media print{
  .pgrp,.iv,.pt,.mini{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h3{font-size:13px;margin:12px 0 2px}
}
.leaflet-tooltip.zlbl{background:rgba(255,255,255,.9);border:0;box-shadow:0 1px 3px rgba(0,0,0,.3);font-weight:700;font-size:11px;padding:1px 6px}
.leaflet-tooltip.zlbl:before{display:none}
</style>
</head>
<body>
<header>
  <button class="back" id="backBtn" style="display:none">‹ Indietro</button>
  <h1 id="hTitle">Squadre in Servizio</h1>
  <span class="offline-badge">offline</span>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-v="servizi" class="on"><span class="ic">🗺️</span>Servizi</button>
  <button data-v="volontari"><span class="ic">👥</span>Volontari</button>
  <button data-v="mezzi"><span class="ic">🚑</span>Mezzi</button>
  <button data-v="impost"><span class="ic">⚙️</span>Impostazioni</button>
</nav>
<div id="dlgRoot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
/* ================= COSTANTI E STATO ================= */
const COLORI=['#d62828','#1d4ed8','#15803d','#f59e0b','#7c3aed','#0891b2','#db2777','#4b5563','#ea580c','#65a30d','#000000','#a16207'];
const MANSIONI_BASE=['Capo squadra','Referente / Coordinatore','Soccorritore','Autista','Medico','Infermiere','OPEM','Logistica','Operatore radio (TLC)','Squadra a piedi','Postazione fissa (PMA)'];
const TIPI_BASE=['Stadio','Concerto','Evento sportivo','Manifestazione / Corteo','Fiera / Sagra','Processione','Gara podistica','Altro'];
const TIPI_MEZZO={'Ambulanza':'🚑','Automedica':'🚗','Pulmino':'🚐','Auto':'🚙','Fuoristrada':'🛻','Moto':'🏍️','Bici':'🚲','Altro':'🚚'};
const MEZZI_CON_AUTISTA=['Ambulanza','Automedica','Pulmino','Auto','Fuoristrada'];
const TIPI_PUNTO={pma:['Posto medico (PMA)','🏥'],ingresso:['Ingresso','🚪'],fuga:['Via di fuga / uscita','🏃'],raccolta:['Punto di raccolta','👥'],parcheggio:['Parcheggio mezzi','🅿️'],radio:['Ponte radio','📡'],acqua:['Punto acqua','💧'],altro:['Altro','⭐']};
const STATI={post:['In postazione','🟢'],pausa:['In pausa','☕'],interv:['In intervento','🚨'],rientrato:['Rientrato','🏠']};
const ESITI=['In corso','Risolto sul posto','Trasportato in ospedale','Rifiuta assistenza','Allontanato','Altro'];
const statoVuoto=()=>({v:2,volontari:[],mansioni:MANSIONI_BASE.slice(),tipi:TIPI_BASE.slice(),nomiPost:[],mezzi:[],luoghi:[],obbligatorie:['Capo squadra'],servizi:[]});
let S=statoVuoto();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const ora=(t=Date.now())=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

/* ---- salvataggio ---- */
const DBN='squadre-servizio',ST='kv';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(ST).objectStore(ST).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(ST,'readwrite');tx.objectStore(ST).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);})}
let saveT=null;
async function saveNow(){clearTimeout(saveT);saveT=null;try{await idbSet('state',S);}catch(e){try{localStorage.setItem('squadre-state',JSON.stringify(S));}catch(e2){toast('⚠️ Impossibile salvare: spazio pieno? Fai un backup.');}}}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,120);}
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)saveNow();});
addEventListener('pagehide',()=>{if(saveT)saveNow();});
async function load(){
  let d=null;
  try{d=await idbGet('state');}catch(e){}
  if(!d){try{const j=localStorage.getItem('squadre-state');if(j)d=JSON.parse(j);}catch(e){}}
  if(d&&d.v)S=Object.assign(statoVuoto(),d);
  migra();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
function migra(){
  S.nomiPost=S.nomiPost||[];S.mezzi=S.mezzi||[];S.luoghi=S.luoghi||[];if(!S.obbligatorie)S.obbligatorie=['Capo squadra'];
  S.servizi.forEach(s=>{
    ['postazioni','mezzi','punti','disegni','interventi','diario'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
    s.assegnazioni.forEach(a=>{
      if(a.postId===undefined){
        a.postId=null;
        if(a.postazione&&a.postazione.trim()){
          const n=a.postazione.trim();let p=s.postazioni.find(x=>x.nome.toLowerCase()===n.toLowerCase());
          if(!p){p={id:uid(),nome:n,pos:a.pos||null};s.postazioni.push(p);}else if(!p.pos&&a.pos)p.pos=a.pos;
          a.postId=p.id;a.pos=null;
          if(!S.nomiPost.some(x=>x.toLowerCase()===n.toLowerCase()))S.nomiPost.push(n);
        }
      }
      delete a.postazione;
      if(!a.stato)a.stato='post';
      if(a.mezzoSvcId===undefined)a.mezzoSvcId=null;
    });
  });
  S.v=2;
}

/* ================= UTILITA' UI ================= */
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function dialog(html,onMount){
  const o=document.createElement('div');o.className='ovl';o.innerHTML='<div class="dlg">'+html+'</div>';
  $('#dlgRoot').appendChild(o);
  const close=()=>o.remove();
  o.addEventListener('click',e=>{if(e.target===o)close();});
  o.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  onMount&&onMount(o.querySelector('.dlg'),close);
  return close;
}
function ask(msg,okTxt='Conferma',danger=true){
  return new Promise(res=>{
    dialog(`<h2>${esc(msg)}</h2><div class="acts"><button class="btn sec" data-no>Annulla</button><button class="btn" data-ok style="${danger?'':'background:var(--ok)'}">${esc(okTxt)}</button></div>`,(d,close)=>{
      d.querySelector('[data-no]').onclick=()=>{close();res(false)};

function compressImg(file,max=2400){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res({src:c.toDataURL('image/jpeg',.85),w,h});};
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;
  });
}

function importaVolontari(){
  dialog(`<h2>Importa volontari da Excel</h2>
  <p class="small mut">Va bene un file Excel (.xlsx, .xls) o .csv. La prima riga deve avere i titoli delle colonne: <b>Nome</b>, <b>Cognome</b>, e se vuoi <b>Telefono</b>, <b>Mansione</b>, <b>Radio</b>. Va bene anche una sola colonna “Nominativo” con nome e cognome insieme.</p>
  <label class="btn full" style="display:block;text-align:center;margin:10px 0">📂 Scegli il file<input type="file" id="xf" accept=".xlsx,.xls,.csv,.ods" style="display:none"></label>
  <button class="btn sec full" id="xm">⬇ Scarica un modello vuoto</button>
  <div class="acts"><button class="btn sec" data-close>Chiudi</button></div>`,(d,close)=>{
    d.querySelector('#xm').onclick=()=>scaricaFile(new Blob(['﻿Nome;Cognome;Telefono;Mansione;Radio\nMario;Rossi;3331234567;Soccorritore;CH 3\n'],{type:'text/csv'}),'modello-volontari.csv');
    d.querySelector('#xf').onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      let rows;
      try{
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
        const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
      }catch(err){
        if(/\.csv$/i.test(file.name)){const t=await file.text();const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';rows=t.split(/\r?\n/).map(r=>r.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));}
        else{toast('Non riesco a leggere il file: serve internet la prima volta per leggere i file Excel',4000);return;}
      }
      rows=rows.filter(r=>r.some(c=>String(c).trim()));
      if(!rows.length){toast('Il file è vuoto');return;}
      close();anteprimaImport(rows);
    };
  });
}
function anteprimaImport(rows){
  const h=rows[0].map(c=>String(c).toLowerCase().trim());
  const find=re=>h.findIndex(c=>re.test(c));
  let iN=find(/^nome$|^nome\b(?!.*cognome)/),iC=find(/cognome/),iX=find(/nominativo|nome e cognome|cognome e nome|^volontario/),
      iT=find(/tel|cell/),iM=find(/mansione|qualifica|ruolo/),iR=find(/radio|canale/);
  let start=1;
  if(iN<0&&iC<0&&iX<0){iN=0;iC=1;iT=rows[0].length>2?2:-1;iM=rows[0].length>3?3:-1;iR=rows[0].length>4?4:-1;start=0;}
  if(iX>=0&&iN>=0&&iC>=0)iX=-1;
  const combinato=iX>=0;
  const build=ordine=>rows.slice(start).map(r=>{
    let nome='',cognome='';
    if(combinato){const p=String(r[iX]).trim().split(/\s+/),PART=/^(de|di|da|del|della|dello|dei|degli|delle|dal|dalla|lo|la|li|le|d'|van|von|mac|mc|san|santa|santo)$/i;if(ordine==='cn'){const c=[p.shift()||''];while(p.length>1&&PART.test(c[c.length-1]))c.push(p.shift());cognome=c.join(' ');nome=p.join(' ');}else{const c=[p.pop()||''];while(p.length>1&&PART.test(p[p.length-1]))c.unshift(p.pop());cognome=c.join(' ');nome=p.join(' ');}}
    else{nome=String(r[iN]??'').trim();cognome=String(r[iC]??'').trim();}
    const cap=s=>s.toLowerCase().replace(/(^|[\s'-])\S/g,x=>x.toUpperCase());
    return{nome:cap(nome),cognome:cap(cognome),telefono:iT>=0?String(r[iT]).trim():'',mansione:iM>=0?String(r[iM]).trim():'',radio:iR>=0?String(r[iR]).trim():''};
  }).filter(v=>v.nome||v.cognome);
  const draw=(d,ordine)=>{
    const l=build(ordine);
    const key=v=>(v.nome+'|'+v.cognome).toLowerCase();
    const esist=new Set(S.volontari.map(key));
    const nuovi=l.filter(v=>!esist.has(key(v)));
    d.querySelector('#pv').innerHTML=`<p><b>${l.length}</b> volontari trovati: <b>${nuovi.length}</b> nuovi${l.length-nuovi.length?`, ${l.length-nuovi.length} già in rubrica (verranno completati se mancano dei dati)`:''}.</p>
      <div class="card" style="padding:6px 10px;max-height:220px;overflow:auto">${l.slice(0,30).map(v=>`<div class="small" style="padding:3px 0;border-bottom:1px solid #eee">Nome: <b>${esc(v.nome)}</b> · Cognome: <b>${esc(v.cognome)}</b> ${v.telefono?'· '+esc(v.telefono):''} ${v.mansione?'· '+esc(v.mansione):''}</div>`).join('')}${l.length>30?`<div class="small mut">…e altri ${l.length-30}</div>`:''}</div>
      <p class="small mut">Controlla che il <b>nome</b> e il <b>cognome</b> siano al posto giusto.</p>`;
    return l;
  };
  dialog(`<h2>Controlla prima di importare</h2>

/* ---- mappa ---- */
function initMap(s){
  if(typeof L==='undefined'){$('#map').innerHTML='<div class="nomap">La mappa non si è caricata: serve internet la prima volta che apri l’app.</div>';return;}
  if(s.mappaTipo==='planimetria'){
    if(!s.planimetria){$('#map').innerHTML='<div class="nomap">Nessuna planimetria caricata.<br>Vai su “Riepilogo” → Modifica per caricarla.</div>';return;}
    const {w,h,src}=s.planimetria,b=[[0,0],[h,w]];
    map=L.map('map',{crs:L.CRS.Simple,minZoom:-5,maxZoom:3,zoomSnap:.25,attributionControl:false});
    L.imageOverlay(src,b).addTo(map);
    map.setMaxBounds(L.latLngBounds(b).pad(.5));
    if(s.view)map.setView(s.view.c,s.view.z);else map.fitBounds(b);
  }else{
    const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,crossOrigin:'anonymous',attribution:'© OpenStreetMap'});
    const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,maxNativeZoom:19,crossOrigin:'anonymous',attribution:'© Esri'});
    baseLayers={'🛰 Satellite':sat,'🗺 Stradale':osm};
    map=L.map('map',{zoomControl:true,layers:[s.base==='osm'?osm:sat]});
    L.control.layers(baseLayers,null,{position:'bottomleft'}).addTo(map);
    map.on('baselayerchange',e=>{s.base=e.layer===osm?'osm':'sat';save();});
    if(s.view)map.setView(s.view.c,s.view.z);
    else{map.setView([41.9,12.5],6);if(s.luogo)cercaLuogo(s.luogo,true);}
  }
  map.on('moveend',()=>{const c=map.getCenter();s.view={c:[c.lat,c.lng],z:map.getZoom()};save();});
  map.on('click',e=>{
    const ll=[e.latlng.lat,e.latlng.lng];
    if(drawing){drawing.pts.push(ll);aggiornaDisegno();return;}
    if(!placing)return;
    const pl=placing;setPlacing(null);
    if(pl.k==='new'){({post:()=>postDialog(null,ll),punto:()=>puntoDialog(null,ll,pl.tipo),interv:()=>intervDialog(null,ll),mezzo:()=>mezzoSvcDialog(null,ll)})[pl.what]();return;}
    const o=oggetto(s,pl.k,pl.id);if(o){o.pos=ll;}
    aggiorna();
  });
  drawMarkers();
}
async function cercaLuogo(q,silent){
  q=(q||'').trim();if(!q||!map)return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&q='+encodeURIComponent(q),{headers:{'Accept-Language':'it'}});
    const j=await r.json();
    if(j[0]){const b=j[0].boundingbox;map.fitBounds([[+b[0],+b[2]],[+b[1],+b[3]]]);if(map.getZoom()<16)map.setZoom(17);}
    else if(!silent)toast('Luogo non trovato: prova a scriverlo diversamente');
  }catch(e){if(!silent)toast('Ricerca non disponibile senza internet');}
}

function drawMarkers(){
  if(!map)return;const s=svc();
  Object.values(markers).forEach(m=>m.remove());markers={};
  const add=(key,pos,icon,popup,obj,z=0)=>{
    const m=L.marker(pos,{icon,draggable:true,autoPan:true,zIndexOffset:z}).addTo(map);

  s.disegni.forEach(g=>{

  });

  s.postazioni.forEach(p=>{
    if(!p.pos)return;const l=s.assegnazioni.filter(a=>a.postId===p.id);
    add('p_'+p.id,p.pos,gruppoIcon(s,'📌 '+esc(p.nome),l),()=>`<div class="pop" style="max-height:260px;overflow:auto"><b>📌 ${esc(p.nome)}</b> <span class="mut small">(${l.length})</span>${l.map(a=>rigaVolPopup(s,a)).join('')}
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="addQui('p','${p.id}')">＋ Volontario qui</button><button class="btn sm sec" onclick="editPost('${p.id}')">Rinomina</button></div></div>`,p,300);
  });
  s.mezzi.forEach(sm=>{
    if(!sm.pos)return;const mz=getMezzo(sm.mezzoId),l=s.assegnazioni.filter(a=>a.mezzoSvcId===sm.id);
    add('m_'+sm.id,sm.pos,gruppoIcon(s,mzEmoji(mz)+' '+esc(mzNome(mz)),l,'mz'),()=>`<div class="pop" style="max-height:260px;overflow:auto"><b>${mzEmoji(mz)} ${esc(mzNome(mz))}</b> <span class="mut small">${esc(mz?mz.tipo:'')}${mz&&mz.targa?' · '+esc(mz.targa):''}</span>${l.map(a=>rigaVolPopup(s,a)).join('')||'<div class="small mut">Nessun equipaggio</div>'}
      <div style="margin-top:8px"><button class="btn sm sec" onclick="mezzoSvcDialog(svc().mezzi.find(x=>x.id==='${sm.id}'))">Equipaggio</button></div></div>`,sm,400);
  });
  s.assegnazioni.forEach(a=>{
    if(luogoDi(s,a).k!=='man'||!a.pos)return;
    add(a.id,a.pos,volIcon(s,a),()=>`<div class="pop"><div class="mut small">✋ Posizionato a mano</div>${rigaVolPopup(s,a)}<div style="margin-top:6px"><button class="btn sm sec" onclick="setPlacing({k:'ass',id:'${a.id}'})">Sposta</button></div></div>`,a,200);
  });
  s.interventi.forEach(i=>{if(i.pos)add('i_'+i.id,i.pos,intervIcon(i),()=>popupInterv(s,i),i,600);});
}
function fitAll(msg){
  const s=svc();if(!map)return;
  const pts=[...s.postazioni,...s.mezzi,...s.punti,...s.interventi].filter(p=>p.pos).map(p=>p.pos)
    .concat(s.assegnazioni.filter(a=>luogoDi(s,a).k==='man'&&a.pos).map(a=>a.pos)).concat(...s.disegni.map(g=>g.pts||[]));
  if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.3),{maxZoom:s.mappaTipo==='reale'?19:2});
  else if(s.mappaTipo==='planimetria'&&s.planimetria)map.fitBounds([[0,0],[s.planimetria.h,s.planimetria.w]]);
  else if(msg)toast('Non c’è ancora niente sulla mappa');
}
function vaiSu(ll,key){
  const s=svc();if(!map)return;map.setView(ll,Math.max(map.getZoom(),s.mappaTipo==='reale'?18:0));
  markers[key]&&markers[key].openPopup&&markers[key].openPopup();
  if(innerWidth<900)document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth'});
}
function mostraOPosiziona(k,o,key){
  if(!map){toast('Mappa non disponibile');return;}

}

/* ---- disegno zone e percorsi ---- */
function iniziaDisegno(tipo){
  setPlacing(null);drawing={tipo,pts:[],lay:null};
  map.getContainer().style.cursor='crosshair';aggiornaDisegno();
  if(innerWidth<900)document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth'});
}
function aggiornaDisegno(){
  if(!drawing)return;
  if(drawing.lay)drawing.lay.remove();
  if(drawing.pts.length)drawing.lay=(drawing.tipo==='zona'&&drawing.pts.length>2?L.polygon(drawing.pts,{color:'#111',dashArray:'6 6',fillOpacity:.1}):L.polyline(drawing.pts,{color:'#111',dashArray:'6 6'})).addTo(map);
  const min=drawing.tipo==='zona'?3:2;
  $('#pbar').innerHTML=`<div class="placing-bar">✏️ Tocca i punti ${drawing.tipo==='zona'?'del contorno della zona':'del percorso'} (${drawing.pts.length})
    <button onclick="drawUndo()">↶</button><button onclick="drawFine()" ${drawing.pts.length<min?'disabled style="opacity:.4"':''}>Fine</button><button onclick="drawStop()">Annulla</button></div>`;
}
window.drawUndo=()=>{if(drawing){drawing.pts.pop();aggiornaDisegno();}};
window.drawStop=()=>{if(drawing&&drawing.lay)drawing.lay.remove();drawing=null;$('#pbar').innerHTML='';if(map)map.getContainer().style.cursor='';};
window.drawFine=()=>{const d=drawing;drawStop();const g={id:uid(),tipo:d.tipo,pts:d.pts,nome:'',colore:d.tipo==='zona'?'#7c3aed':'#15803d',tratt:false};disegnoDialog(null,g);};
window.disegnoDialog=(id,nuovoG)=>{
  const s=svc();const g=nuovoG||s.disegni.find(x=>x.id===id);if(map)map.closePopup();
  dialog(`<h2>${g.tipo==='zona'?'Zona':'Percorso'}</h2><form id="fg">
    <label class="f">Nome<input name="nome" required value="${esc(g.nome)}" placeholder="${g.tipo==='zona'?'es. Settore ospiti, Area PMA':'es. Via di fuga Curva Sud'}"></label>
    <label class="f">Colore</label><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${COLORI.map(c=>`<button type="button" data-c="${c}" style="width:34px;height:34px;border-radius:50%;background:${c};border:3px solid ${c===g.colore?'#111':'#fff'};box-shadow:0 0 0 1px #ccc;cursor:pointer"></button>`).join('')}</div>
    ${g.tipo==='percorso'?`<label class="chk"><input type="checkbox" name="tr" ${g.tratt?'checked':''}> Linea tratteggiata</label>`:''}
    <div class="acts">${nuovoG?'':'<button type="button" class="btn ghost" id="delG" style="margin-right:auto">Elimina</button>'}<button type="button" class="btn sec" data-close>Annulla</button><button class="btn">Salva</button></div></form>`,(d,close)=>{
    let col=g.colore;
    d.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{col=b.dataset.c;d.querySelectorAll('[data-c]').forEach(x=>x.style.borderColor=x.dataset.c===col?'#111':'#fff');});
    const del=d.querySelector('#delG');if(del)del.onclick=()=>{s.disegni=s.disegni.filter(x=>x!==g);close();aggiorna();};
    d.querySelector('#fg').onsubmit=e=>{e.preventDefault();const f=e.target;g.nome=f.nome.value.trim();g.colore=col;if(f.tr)g.tratt=f.tr.checked;if(nuovoG)s.disegni.push(g);close();aggiorna();};
  });
};

/* ---- stato e azioni volontario ---- */
function cambiaStato(s,a,st,silenzioso){
  if(a.stato===st)return;a.stato=st;
  logD(s,`${vNome(getVol(a.volId))} → ${STATI[st][0].toLowerCase()}`);
  if(!silenzioso)aggiorna();
}
window.azioniVol=id=>{
  const s=svc(),a=assOf(s,id);if(!a)return;const v=getVol(a.volId),lu=luogoDi(s,a);

    ...contattiItems(v),
    {t:'📍 '+(lu.pos?'Mostra sulla mappa':'Metti sulla mappa'),fn:()=>{if(lu.k==='post')mostraOPosiziona('post',lu.o,'p_'+lu.o.id);else if(lu.k==='mezzo')mostraOPosiziona('mezzo',lu.o,'m_'+lu.o.id);else mostraOPosiziona('ass',a,a.id);}},

  d.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{cambiaStato(s,a,b.dataset.st);d.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',x===b));toast(vNome(v)+': '+STATI[b.dataset.st][0].toLowerCase());});

function controlli(s){
  const w=[];
  const np=s.assegnazioni.filter(a=>!posizionato(s,a));
  if(np.length)w.push(`📍 ${np.length} volontari non sono sulla mappa: ${np.slice(0,5).map(a=>vNome(getVol(a.volId))).join(', ')}${np.length>5?'…':''}`);
  s.postazioni.forEach(p=>{
    if(!s.assegnazioni.some(a=>a.postId===p.id))w.push(`📌 Postazione “${p.nome}” senza volontari`);
    if(!p.pos)w.push(`📌 Postazione “${p.nome}” non è sulla mappa`);
  });
  s.mezzi.forEach(sm=>{
    const mz=getMezzo(sm.mezzoId),l=s.assegnazioni.filter(a=>a.mezzoSvcId===sm.id);
    if(!l.length)w.push(`${mzEmoji(mz)} ${mzNome(mz)} senza equipaggio`);
    else if(mz&&MEZZI_CON_AUTISTA.includes(mz.tipo)&&!l.some(a=>a.mansione==='Autista'))w.push(`${mzEmoji(mz)} ${mzNome(mz)}: nell’equipaggio manca l’autista`);
    if(!sm.pos)w.push(`${mzEmoji(mz)} ${mzNome(mz)} non è sulla mappa`);
  });
  s.squadre.forEach(q=>{
    const l=s.assegnazioni.filter(a=>a.squadraId===q.id);if(!l.length)return;
    S.obbligatorie.forEach(m=>{if(!l.some(a=>a.mansione===m))w.push(`👥 ${q.nome}: manca “${m}”`);});
  });
  const senzaSq=s.assegnazioni.filter(a=>!sqOf(s,a.squadraId)).length;
  if(senzaSq&&s.squadre.length)w.push(`👥 ${senzaSq} volontari senza squadra`);
  const aperti=s.interventi.filter(i=>i.esito==='In corso').length;
  if(aperti)w.push(`⚠️ ${aperti} interventi ancora in corso`);
  return w;
}

/* ================= GPS ================= */
function toggleGps(){if(gps)stopGps();else startGps();}
function startGps(){
  if(!navigator.geolocation){toast('Posizione non disponibile su questo dispositivo');return;}
  gps={first:true,marker:null,circle:null};
  const b=$('#tGps');if(b)b.classList.add('on');
  toast('Cerco la tua posizione…');
  gps.watch=navigator.geolocation.watchPosition(p=>{
    if(!gps||!map)return;const ll=[p.coords.latitude,p.coords.longitude];
    if(!gps.marker){gps.circle=L.circle(ll,{radius:p.coords.accuracy,color:'#2563eb',weight:1,fillOpacity:.1}).addTo(map);gps.marker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('Tu sei qui');}
    else{gps.marker.setLatLng(ll);gps.circle.setLatLng(ll).setRadius(p.coords.accuracy);}
    if(gps.first){gps.first=false;map.setView(ll,Math.max(map.getZoom(),17));}
  },err=>{toast(err.code===1?'Permesso posizione negato: attivalo nelle impostazioni del telefono':'Posizione non trovata',3500);stopGps();},{enableHighAccuracy:true,maximumAge:5000});
}
function stopGps(){
  if(!gps)return;try{navigator.geolocation.clearWatch(gps.watch);}catch(e){}
  if(gps.marker)gps.marker.remove();if(gps.circle)gps.circle.remove();gps=null;
  const b=$('#tGps');if(b)b.classList.remove('on');
}

  ],'<p class="small mut" style="margin-top:-6px">L’immagine e il messaggio si possono mandare ai volontari, così ognuno vede dov’è la sua postazione.</p>');

function testoServizio(s){
  const r=[`*${s.nome}*`,`${s.tipo}${s.data?' · '+fmtData(s.data):''}${s.luogo?' · '+s.luogo:''}`,''];
  const riga=a=>{const v=getVol(a.volId);return`• ${vNome(v)}${a.mansione?' ('+a.mansione+')':''}${a.radio?' 📻 '+a.radio:''}${a.inizio||a.fine?' 🕒 '+(a.inizio||'?')+'-'+(a.fine||'?'):''}`;};
  s.postazioni.forEach(p=>{const l=s.assegnazioni.filter(a=>a.postId===p.id);if(l.length){r.push(`📌 *${p.nome}*`);l.forEach(a=>r.push(riga(a)));r.push('');}});
  s.mezzi.forEach(sm=>{const mz=getMezzo(sm.mezzoId),l=s.assegnazioni.filter(a=>a.mezzoSvcId===sm.id);if(l.length){r.push(`${mzEmoji(mz)} *${mzNome(mz)}*`);l.forEach(a=>r.push(riga(a)));r.push('');}});
  const man=s.assegnazioni.filter(a=>luogoDi(s,a).k==='man');if(man.length){r.push('✋ *Altri*');man.forEach(a=>r.push(riga(a)));r.push('');}
  if(s.punti.length){r.push('*Punti utili*');s.punti.forEach(p=>r.push(`${TIPI_PUNTO[p.tipo][1]} ${p.nome||TIPI_PUNTO[p.tipo][0]}`));}
  return r.join('\n').trim();
}
async function condividiTesto(){
  const s=svc(),t=testoServizio(s);
  try{if(navigator.share){await navigator.share({text:t});return;}}catch(e){if(e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(t);toast('Testo copiato: incollalo in WhatsApp');}catch(e){}
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
async function condividiImmagine(){
  if(!map){toast('Mappa non disponibile');return;}
  const s=svc();setPlacing(null);
  toast('Preparo l’immagine…',1800);
  let c;
  try{c=await disegnaImmagine(s,true);await new Promise((res,rej)=>{try{c.toBlob(b=>b?res():rej(),'image/png');}catch(e){rej(e);}});}
  catch(e){c=await disegnaImmagine(s,false);}
  c.toBlob(async blob=>{
    const nome=(s.nome||'servizio').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')+'.png';
    const file=new File([blob],nome,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:s.nome});return;}}catch(e){if(e.name==='AbortError')return;}
    scaricaFile(blob,nome);toast('Immagine salvata nei download');
  },'image/png');
}
function caricaImg(src,cors){return new Promise(res=>{const i=new Image();if(cors)i.crossOrigin='anonymous';const t=setTimeout(()=>res(null),8000);i.onload=()=>{clearTimeout(t);res(i);};i.onerror=()=>{clearTimeout(t);res(null);};i.src=src;});}
async function disegnaImmagine(s,conSfondo){
  fitAll();await new Promise(r=>setTimeout(r,500));
  const size=map.getSize(),K=2,W=Math.max(size.x,640),HEAD=74;
  // elenco sotto la mappa
  const righe=[];
  s.postazioni.forEach(p=>{const l=s.assegnazioni.filter(a=>a.postId===p.id);if(l.length)righe.push({t:'📌 '+p.nome,b:1},...l.map(a=>({t:'   '+vNome(getVol(a.volId))+(a.mansione?' — '+a.mansione:'')+(a.radio?' · 📻 '+a.radio:''),c:colOf(s,a)})));});
  s.mezzi.forEach(sm=>{const mz=getMezzo(sm.mezzoId),l=s.assegnazioni.filter(a=>a.mezzoSvcId===sm.id);if(l.length)righe.push({t:mzEmoji(mz)+' '+mzNome(mz),b:1},...l.map(a=>({t:'   '+vNome(getVol(a.volId))+(a.mansione?' — '+a.mansione:''),c:colOf(s,a)})));});
  const man=s.assegnazioni.filter(a=>luogoDi(s,a).k==='man');if(man.length)righe.push({t:'✋ Altri',b:1},...man.map(a=>({t:'   '+vNome(getVol(a.volId))+(a.mansione?' — '+a.mansione:''),c:colOf(s,a)})));
  const LH=22,LIST=righe.length?righe.length*LH+24:0;
  const c=document.createElement('canvas');c.width=W*K;c.height=(HEAD+size.y+LIST)*K;
  const x=c.getContext('2d');x.scale(K,K);
  x.fillStyle='#fff';x.fillRect(0,0,W,HEAD+size.y+LIST);
  x.fillStyle='#b5121b';x.fillRect(0,0,W,HEAD);
  x.fillStyle='#fff';x.font='bold 20px system-ui,sans-serif';x.fillText(s.nome,14,30);
  x.font='14px system-ui,sans-serif';x.fillText(`${s.tipo}${s.data?' · '+fmtData(s.data):''}${s.luogo?' · '+s.luogo:''}`,14,52);
  let lx=14;x.font='12px system-ui,sans-serif';
  s.squadre.forEach(q=>{x.fillStyle=q.colore;x.beginPath();x.arc(lx+6,66,5,0,7);x.fill();x.fillStyle='#fff';x.fillText(q.nome,lx+14,70);lx+=x.measureText(q.nome).width+30;});
  const ox=(W-size.x)/2,oy=HEAD;
  x.save();x.beginPath();x.rect(ox,oy,size.x,size.y);x.clip();
  x.fillStyle='#e5e7eb';x.fillRect(ox,oy,size.x,size.y);
  if(s.mappaTipo==='planimetria'&&s.planimetria){
    const im=await caricaImg(s.planimetria.src);
    const tl=map.latLngToContainerPoint([s.planimetria.h,0]),br=map.latLngToContainerPoint([0,s.planimetria.w]);
    if(im)x.drawImage(im,ox+tl.x,oy+tl.y,br.x-tl.x,br.y-tl.y);
  }else if(conSfondo){
    const z=Math.round(map.getZoom()),pb=map.getPixelBounds(),tpl=s.base==='osm'?'https://tile.openstreetmap.org/{z}/{x}/{y}.png':'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
    const jobs=[];
    for(let tx=Math.floor(pb.min.x/256);tx<=Math.floor(pb.max.x/256);tx++)for(let ty=Math.floor(pb.min.y/256);ty<=Math.floor(pb.max.y/256);ty++){
      const u=tpl.replace('{z}',z).replace('{x}',tx).replace('{y}',ty);
      jobs.push(caricaImg(u,true).then(im=>{if(im)x.drawImage(im,ox+tx*256-pb.min.x,oy+ty*256-pb.min.y,256,256);}));
    }
    await Promise.all(jobs);
  }
  const P=ll=>{const p=map.latLngToContainerPoint(ll);return[ox+p.x,oy+p.y];};
  const etichetta=(t,cx,cy,bold)=>{x.font=(bold?'bold ':'')+'11px system-ui,sans-serif';const w=x.measureText(t).width+10;x.fillStyle='rgba(255,255,255,.95)';x.fillRect(cx-w/2,cy,w,16);x.fillStyle='#111';x.fillText(t,cx-w/2+5,cy+12);};
  const cerchio=(cx,cy,r,col,txt)=>{x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle=col;x.fill();x.lineWidth=2;x.strokeStyle='#fff';x.stroke();if(txt){x.fillStyle='#fff';x.font='bold '+(r>12?12:9)+'px system-ui,sans-serif';const w=x.measureText(txt).width;x.fillText(txt,cx-w/2,cy+(r>12?4:3));}};
  s.disegni.forEach(g=>{const pts=(g.pts||[]).map(P);if(pts.length<2)return;x.beginPath();x.moveTo(...pts[0]);pts.slice(1).forEach(p=>x.lineTo(...p));
    x.strokeStyle=g.colore;x.lineWidth=g.tipo==='zona'?3:5;x.setLineDash(g.tratt?[10,8]:[]);

    const cx=pts.reduce((a,p)=>a+p[0],0)/pts.length,cy=pts.reduce((a,p)=>a+p[1],0)/pts.length;etichetta(g.nome,cx,cy-8,true);});
  s.punti.forEach(p=>{if(!p.pos)return;const[cx,cy]=P(p.pos);x.beginPath();x.arc(cx,cy,16,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2;x.strokeStyle='#111';x.stroke();x.font='17px system-ui';x.fillStyle='#111';const e=TIPI_PUNTO[p.tipo][1];x.fillText(e,cx-x.measureText(e).width/2,cy+6);etichetta(p.nome||TIPI_PUNTO[p.tipo][0],cx,cy+18);});
  s.assegnazioni.forEach(a=>{if(luogoDi(s,a).k!=='man'||!a.pos)return;const[cx,cy]=P(a.pos);cerchio(cx,cy,15,colOf(s,a),iniz(getVol(a.volId)));etichetta(vNome(getVol(a.volId)),cx,cy+17);});

    x.beginPath();x.arc(cx,cy,5,0,7);x.fillStyle='#111';x.fill();x.strokeStyle='#fff';x.stroke();
    x.fillStyle='#111';x.font='bold 12px system-ui,sans-serif';x.fillText(titolo,cx-x.measureText(titolo).width/2,by+16);
    lista.forEach((a,k)=>cerchio(cx-(lista.length*24)/2+12+k*24,by+32,10,colOf(s,a),iniz(getVol(a.volId))));

  s.postazioni.forEach(p=>{if(p.pos)box(p.pos,'📌 '+p.nome,s.assegnazioni.filter(a=>a.postId===p.id),'#111');});
  s.mezzi.forEach(sm=>{if(sm.pos){const mz=getMezzo(sm.mezzoId);box(sm.pos,mzEmoji(mz)+' '+mzNome(mz),s.assegnazioni.filter(a=>a.mezzoSvcId===sm.id),'#1d4ed8');}});
  s.interventi.forEach(i=>{if(!i.pos)return;const[cx,cy]=P(i.pos);cerchio(cx,cy,13,i.esito==='In corso'?'#f97316':'#9ca3af',String(i.n));});
  x.restore();
  if(!conSfondo&&s.mappaTipo==='reale'){x.fillStyle='#6b7280';x.font='12px system-ui';x.fillText('(sfondo della mappa non disponibile)',ox+8,oy+size.y-8);}
  let y=HEAD+size.y+20;
  righe.forEach(r=>{x.font=(r.b?'bold 14px':'13px')+' system-ui,sans-serif';if(r.c){x.fillStyle=r.c;x.beginPath();x.arc(26,y-5,5,0,7);x.fill();}x.fillStyle='#111';x.fillText(r.t.trim(),r.c?36:14,y);y+=LH;});
  return c;
}

/* ================= STAMPA / PDF ================= */
function stampa(){
  const s=svc();if(!s)return;
  setPlacing(null);
  $('#printHead').innerHTML=`<h1>${esc(s.nome)}</h1><p>${esc(s.tipo)}${s.data?' · '+fmtData(s.data):''}${s.luogo?' · '+esc(s.luogo):''} · ${s.assegnazioni.length} volontari · ${s.postazioni.length} postazioni · ${s.mezzi.length} mezzi</p>
  <div class="legend">${s.squadre.map(q=>`<span><span class="dot" style="background:${q.colore}"></span>${esc(q.nome)}</span>`).join('')}</div>`;
  const gruppi=s.squadre.map(q=>({q,l:s.assegnazioni.filter(a=>a.squadraId===q.id)}));
  const senza=s.assegnazioni.filter(a=>!sqOf(s,a.squadraId));if(senza.length)gruppi.push({q:{nome:'Senza squadra',colore:'#6b7280'},l:senza});
  $('#printTable').innerHTML=`<h3>Volontari</h3><table><thead><tr><th>Volontario</th><th>Mansione</th><th>Postazione / mezzo</th><th>Telefono</th><th>Radio</th><th>Turno</th><th>Note</th></tr></thead><tbody>
  ${gruppi.filter(g=>g.l.length).map(g=>{const capo=g.q.capo&&assOf(s,g.q.capo);return`<tr class="ptsq"><td colspan="7"><span class="dot" style="background:${g.q.colore};width:10px;height:10px"></span> ${esc(g.q.nome)}${capo?' — capo squadra: '+esc(vNome(getVol(capo.volId))):''}</td></tr>`+
    g.l.map(a=>{const v=getVol(a.volId),lu=luogoDi(s,a);return`<tr><td>${esc(vNome(v))}</td><td>${esc(a.mansione)}</td><td>${esc(lu.l)}${lu.pos?'':' (non sulla mappa)'}</td><td>${esc(v?v.telefono:'')}</td><td>${esc(a.radio)}</td><td>${esc(a.inizio)}${a.inizio||a.fine?'–':''}${esc(a.fine)}</td><td>${esc(a.note)}</td></tr>`}).join('')}).join('')}
  </tbody></table>
  ${s.mezzi.length?`<h3>Mezzi</h3><table><thead><tr><th>Mezzo</th><th>Tipo</th><th>Targa</th><th>Equipaggio</th></tr></thead><tbody>${s.mezzi.map(sm=>{const mz=getMezzo(sm.mezzoId);return`<tr><td>${esc(mzNome(mz))}</td><td>${esc(mz?mz.tipo:'')}</td><td>${esc(mz?mz.targa:'')}</td><td>${s.assegnazioni.filter(a=>a.mezzoSvcId===sm.id).map(a=>esc(vNome(getVol(a.volId)))+(a.mansione?' ('+esc(a.mansione)+')':'')).join(', ')}</td></tr>`}).join('')}</tbody></table>`:''}
  ${s.punti.length?`<h3>Punti fissi</h3><table><tbody>${s.punti.map(p=>`<tr><td>${TIPI_PUNTO[p.tipo][1]} ${esc(p.nome||TIPI_PUNTO[p.tipo][0])}</td><td>${esc(TIPI_PUNTO[p.tipo][0])}</td><td>${esc(p.note)}</td></tr>`).join('')}</tbody></table>`:''}
  ${s.interventi.length?`<h3>Interventi</h3><table><thead><tr><th>N.</th><th>Ora</th><th>Descrizione</th><th>Volontari</th><th>Esito</th><th>Note</th></tr></thead><tbody>${s.interventi.slice().sort((a,b)=>a.n-b.n).map(i=>`<tr><td>${i.n}</td><td>${esc(i.ora)}</td><td>${esc(i.descr)}</td><td>${i.vol.map(id=>{const a=assOf(s,id);return a?esc(vNome(getVol(a.volId))):''}).filter(Boolean).join(', ')}</td><td>${esc(i.esito)}</td><td>${esc(i.note)}</td></tr>`).join('')}</tbody></table>`:''}
  <p style="font-size:10px;color:#666">Stampato il ${new Date().toLocaleString('it-IT')}</p>`;
  document.body.classList.remove('hide-labels');
  document.body.classList.add('printing');
  if(map){map.invalidateSize();fitAll();}
  toast('Preparo la stampa… scegli “Salva come PDF” per avere il file',2000);
  setTimeout(()=>{
    const fine=()=>{document.body.classList.remove('printing');if(map)map.invalidateSize();window.removeEventListener('afterprint',fine);};
    window.addEventListener('afterprint',fine);
    try{window.print();}catch(e){toast('Stampa non disponibile qui');}
    setTimeout(()=>{if(!matchMedia('print').matches)fine();},1500);
  },1300);
}

/* ================= MAPPA OFFLINE ================= */
function tile(lat,lng,z){const n=2**z,x=Math.floor((lng+180)/360*n),r=lat*Math.PI/180,y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return[Math.max(0,Math.min(n-1,x)),Math.max(0,Math.min(n-1,y))];}
async function scaricaOffline(){
  if(!map)return;
  if(!('caches' in window)||!navigator.serviceWorker||!navigator.serviceWorker.controller){toast('Funziona solo con l’app aperta dal suo indirizzo internet',3500);return;}
  if(!navigator.onLine){toast('Serve internet per scaricare la mappa');return;}
  const b=map.getBounds(),z0=Math.max(map.getZoom(),13),z1=Math.min(z0+3,19);
  const urls=[];
  for(let z=z0;z<=z1;z++){
    const [x1,y1]=tile(b.getNorth(),b.getWest(),z),[x2,y2]=tile(b.getSouth(),b.getEast(),z);
    for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++){
      urls.push(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`);
      urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
    }
  }
  if(urls.length>1200){toast('Zona troppo grande: avvicinati di più sulla mappa e riprova',3500);return;}
  if(!await ask(`Scaricare la zona visibile per usarla senza internet? (${urls.length} pezzi di mappa, satellite + stradale)`,'Scarica',false))return;
  const cache=await caches.open('tiles-v1');let done=0,err=0;
  const bar=document.createElement('div');bar.className='toast';document.body.appendChild(bar);
  const q=urls.slice();
  async function worker(){while(q.length){const u=q.shift();try{const h=await cache.match(u);if(!h||h.type==='opaque'){let r;try{r=await fetch(u,{mode:'cors'});}catch(e){r=await fetch(u,{mode:'no-cors'});}await cache.put(u,r);}}catch(e){err++;}done++;bar.textContent=`Scarico mappa… ${Math.round(done/urls.length*100)}%`;}}
  await Promise.all([1,2,3,4].map(worker));
  bar.remove();toast(err?`Mappa scaricata (${err} pezzi non riusciti)`:'✅ Mappa della zona salvata per l’uso offline',3500);
}

/* ================= AVVIO ================= */
function netState(){document.body.classList.toggle('is-offline',!navigator.onLine);}
addEventListener('online',netState);addEventListener('offline',netState);netState();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
load().then(()=>setView('servizi'));
</script>
